<div class="main-content" (click)="closeMenu()">
  <div class="header">
    <h1 class="title">Config</h1>
    <button class="btn btn-primary" (click)="openNewConfigModal()">
      <span>New config</span>
    </button>
  </div>

  <div class="filters-container">
    <div class="search-input-wrapper">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M14.77 13.27L19.49 18L18 19.49L13.27 14.77C11.9754 15.7958 10.3705 16.3314 8.68333 16.3333C4.44976 16.3333 1.01666 12.9002 1.01666 8.66666C1.01666 4.43309 4.44976 1 8.68333 1C12.9169 1 16.35 4.43309 16.35 8.66666C16.3503 10.3712 15.8016 11.993 14.77 13.27ZM12.7233 12.44C13.7915 11.4191 14.3756 10.0637 14.35 8.66666C14.35 5.53583 11.8142 3 8.68333 3C5.5525 3 3.01666 5.53583 3.01666 8.66666C3.01666 11.7975 5.5525 14.3333 8.68333 14.3333C10.0763 14.3582 11.4239 13.7885 12.44 12.7233L12.7233 12.44Z" fill="#52494A"/>
      </svg>
      <input type="text" placeholder="Search config" [(ngModel)]="searchTerm">
    </div>
  </div>

  <div class="table-container" *ngIf="filteredConfigs.length > 0">
    <table class="table">
      <thead>
        <tr>
          <th style="width: 25%">Field name</th>
          <th style="width: 15%">Field value</th>
          <th style="width: 55%">Description</th>
          <th class="action-th" style="width: 5%"></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of filteredConfigs" (click)="goToConfig(item.id)" class="clickable-row">
          <td class="name-cell">{{ item.name }}</td>
          <td class="value-cell">{{ item.value }}</td>
          <td>{{ item.description }}</td>
          <td class="action-cell">
            <button class="icon-btn" (click)="toggleMenu(item.id, $event)">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="6" r="1.5" fill="#1A1415"/>
                <circle cx="12" cy="12" r="1.5" fill="#1A1415"/>
                <circle cx="12" cy="18" r="1.5" fill="#1A1415"/>
              </svg>
            </button>
            <div class="dropdown-menu" *ngIf="activeMenuId === item.id" (click)="$event.stopPropagation()">
              <div class="dropdown-item" (click)="goToConfig(item.id)">View details</div>
              <div class="dropdown-item" (click)="goToEdit(item.id)">Edit value</div>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  
  <div class="pagination" *ngIf="filteredConfigs.length > 0">
    <div class="pagination-info">Showing 1–{{ filteredConfigs.length }} of 16</div>
    <div class="pagination-controls">
      <button class="page-btn text-btn disabled">Previous</button>
      <button class="page-btn active">1</button>
      <button class="page-btn">2</button>
      <button class="page-btn text-btn">Next</button>
    </div>
  </div>

  <!-- New config modal -->
  <div class="modal-overlay" *ngIf="isNewConfigModalOpen" (click)="closeNewConfigModal()">
    <div class="modal-content form-modal" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h2 class="modal-title">New config</h2>
      </div>
      
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">Name</label>
          <input type="text" class="form-control" [(ngModel)]="newConfigName" placeholder="e.g. Maximum export rows">
        </div>
        <div class="form-group">
          <label class="form-label">Value</label>
          <input type="text" class="form-control" [(ngModel)]="newConfigValue" placeholder="e.g. 500 rows">
        </div>
        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea class="form-control" rows="3" [(ngModel)]="newConfigDescription" placeholder="What this value controls, in plain language"></textarea>
        </div>
      </div>
      
      <div class="modal-footer">
        <button class="btn btn-secondary" (click)="closeNewConfigModal()">Cancel</button>
        <button class="btn btn-primary" (click)="openConfirmCreateModal()" [disabled]="!newConfigName || !newConfigValue">Create config</button>
      </div>
    </div>
  </div>

  <!-- Confirm create modal -->
  <div class="modal-overlay" *ngIf="isConfirmCreateModalOpen" (click)="closeConfirmCreateModal()">
    <div class="modal-content confirm-modal" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h2 class="modal-title">Create this config value?</h2>
      </div>
      
      <div class="modal-body">
        <p class="modal-helper-text">
          <span class="highlight">{{ newConfigName || 'This value' }}</span> will be added to the table and available immediately.
        </p>
      </div>
      
      <div class="modal-footer">
        <button class="btn btn-secondary" (click)="closeConfirmCreateModal()">Cancel</button>
        <button class="btn btn-primary" (click)="confirmCreateConfig()">Create config</button>
      </div>
    </div>
  </div>
</div>
