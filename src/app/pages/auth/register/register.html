<app-auth-card
  title="Create your account"
  subtitle="Start building with Fonepay APIs today."
>
  <form class="auth-form">
    <app-input
      label="Full name"
      placeholder="e.g. Ram Bahadur"
      type="text"
    ></app-input>

    <app-input
      label="Work email"
      placeholder="you@company.com"
      type="email"
    ></app-input>

    <div class="password-group">
      <app-input
        label="Password"
        placeholder="Create a password"
        type="password"
      ></app-input>
      <app-password-rules></app-password-rules>
    </div>

    <div class="actions">
      <button class="btn-primary" type="button">Create account</button>
      <p class="footnote">
        Already have an account? <a href="/login">Log in</a>
      </p>
    </div>
  </form>
</app-auth-card>
