<app-page-hero
  title="Build with Fonepay"
  description="Integrate Nepal's largest interoperable payment network into your applications. Fast, secure, and developer-friendly."
  primaryActionLabel="Start building"
  secondaryActionLabel="Explore products"
></app-page-hero>

<div class="landing-content">
  <!-- Products Section -->
  <section class="section">
    <app-section-header
      title="Explore our products"
      description="APIs for collections, payouts, and everything in between."
      actionLabel="View all products"
    ></app-section-header>
    <div class="product-grid">
      <app-product-tile
        title="Fonepay QR"
        description="Accept payments instantly by generating dynamic QR codes."
      ></app-product-tile>
      <app-product-tile
        title="Autopay"
        description="Set up recurring mandates and collect payments automatically."
      ></app-product-tile>
      <app-product-tile
        title="Checkout"
        description="Process payments natively within your app or website."
      ></app-product-tile>
    </div>
  </section>

  <!-- Integration Steps -->
  <section class="section">
    <app-integration-steps sectionTitle="The path to going live"></app-integration-steps>
  </section>

  <!-- Support Section -->
  <section class="section support-section">
    <app-support-block>
      <app-support-card
        title="Documentation"
        description="Read our comprehensive guides and integration tutorials."
        linkText="Read docs"
      ></app-support-card>
      <app-support-card
        title="API Reference"
        description="Detailed API specs, parameters, and example requests."
        linkText="View API ref"
      ></app-support-card>
      <app-support-card
        title="Support"
        description="Need help? Reach out to our developer support team."
        linkText="Contact us"
      ></app-support-card>
    </app-support-block>
  </section>
</div>
