<ng-container *ngIf="loading">
  <div class="page-content" style="text-align: center; padding: 48px;">
    Loading...
  </div>
</ng-container>

<ng-container *ngIf="!loading && !product">
  <div class="page-content" style="text-align: center; padding: 100px 24px;">
    <h2>Product not found</h2>
    <p style="color: #706768; margin-top: 16px;">The product you are trying to view does not exist or you do not have permission to view it.</p>
    <a routerLink="/portal/products" style="display: inline-block; margin-top: 24px; color: #142e55; text-decoration: underline;">Back to Products</a>
  </div>
</ng-container>

<ng-container *ngIf="!loading && product">
  <app-page-hero
    [breadcrumb]="'Products > ' + product.name"
    [title]="product.name"
    [description]="product.shortDescription"
    primaryActionLabel="Read the docs"
    secondaryActionLabel="API Reference"
  ></app-page-hero>

  <div class="page-content">
    <div class="pe-content" style="max-width: 800px; margin: 0 auto; padding: 48px 24px;">
      <ng-container *ngFor="let block of blocks">
        <app-block-renderer [block]="block"></app-block-renderer>
      </ng-container>
    </div>

    <!-- Closing CTA -->
    <section class="section">
      <app-account-cta-banner
        title="Ready to automate collections?"
        description="Create a sandbox account to test the Autopay flow with dummy credentials."
        actionLabel="Create sandbox account"
      ></app-account-cta-banner>
    </section>
  </div>
</ng-container>
