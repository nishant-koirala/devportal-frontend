<div class="page-head">
  <div class="inner">
    <h1 class="title">Getting Started</h1>
    <p class="description">Your journey to integrating Nepal's largest payment network begins here.</p>
  </div>
</div>

<div class="page-content">
  <!-- Integration Steps -->
  <app-integration-steps sectionTitle="Start building in minutes"></app-integration-steps>

  <!-- Products you can integrate -->
  <section class="section">
    <app-section-header
      title="Products you can integrate"
      description="Choose the APIs that fit your business needs."
      actionLabel="View all products"
    ></app-section-header>
    
    <div class="products-grid">
      <app-product-card
        title="Fonepay QR"
        description="Dynamic or static QR codes for instant payments."
        statusBadge="Live"
        actionLabel="Explore API"
      ></app-product-card>
      
      <app-product-card
        title="Checkout by Fonepay"
        description="In-app browser checkout flows."
        statusBadge="Live"
        actionLabel="Explore API"
      ></app-product-card>
      
      <app-product-card
        title="Autopay by Fonepay"
        description="Recurring mandate management."
        statusBadge="Beta"
        actionLabel="Explore API"
      ></app-product-card>
    </div>
  </section>

  <!-- Support -->
  <section class="section support-section">
    <app-support-block>
      <app-support-card
        title="Support and FAQ"
        description="Find answers to common questions about integration."
        linkText="View FAQs"
      ></app-support-card>
      <app-support-card
        title="Resources"
        description="Download logos, SDKs, and postman collections."
        linkText="View resources"
      ></app-support-card>
      <app-support-card
        title="Email the developer team"
        description="developer@fonepay.com"
        linkText="Contact us"
      ></app-support-card>
    </app-support-block>
  </section>
</div>
