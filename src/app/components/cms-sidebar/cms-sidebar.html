<aside class="cms-sidebar">
  <div class="sidebar-header-row">
    <span class="sidebar-title">Sections and pages</span>
    <button class="add-section-btn" (click)="onAddSection()" title="Add Section">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 3.33331V12.6666" stroke="#CE2027" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M3.33337 8H12.6667" stroke="#CE2027" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Add Section
    </button>
  </div>

  <div class="tree-container">

    <!-- Loading State -->
    <ng-container *ngIf="isLoadingTree">
      <div class="tree-loading">Loading tree...</div>
    </ng-container>

    <!-- Empty State -->
    <ng-container *ngIf="!isLoadingTree && tree.length === 0">
      <div class="tree-empty">
        No sections yet. Click "+ Add Section" to start.
      </div>
    </ng-container>

    <!-- Actual Tree Data -->
    <ng-container *ngFor="let section of tree">
      <div class="tree-section">
        <div class="section-header" (click)="toggleSection(section.id)">
          <svg class="chevron" [class.expanded]="expandedSections.has(section.id)" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 4L10 8L6 12" stroke="#52494A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="section-name">{{ section.title }}</span>
          <div class="section-actions">
            <button class="add-page-btn" (click)="onAddPage(section.id, $event)" title="Add page">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path d="M8 3.33331V12.6666" stroke="#8E8686" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M3.33337 8H12.6667" stroke="#8E8686" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <div class="dropdown-container">
              <button class="section-menu-btn" (click)="toggleSectionMenu(section.id, $event)" [class.active]="sectionMenuOpenId === section.id">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M8 8.66669C8.36819 8.66669 8.66667 8.36821 8.66667 8.00002C8.66667 7.63183 8.36819 7.33335 8 7.33335C7.63181 7.33335 7.33333 7.63183 7.33333 8.00002C7.33333 8.36821 7.63181 8.66669 8 8.66669Z" fill="#1A1415"/>
                  <path d="M12.6667 8.66669C13.0349 8.66669 13.3333 8.36821 13.3333 8.00002C13.3333 7.63183 13.0349 7.33335 12.6667 7.33335C12.2985 7.33335 12 7.63183 12 8.00002C12 8.36821 12.2985 8.66669 12.6667 8.66669Z" fill="#1A1415"/>
                  <path d="M3.33333 8.66669C3.70152 8.66669 4 8.36821 4 8.00002C4 7.63183 3.70152 7.33335 3.33333 7.33335C2.96514 7.33335 2.66667 7.63183 2.66667 8.00002C2.66667 8.36821 2.96514 8.66669 3.33333 8.66669Z" fill="#1A1415"/>
                </svg>
              </button>
              <div class="dropdown-menu section-dropdown" *ngIf="sectionMenuOpenId === section.id" (click)="$event.stopPropagation()">
                <button class="dropdown-item">Rename</button>
                <div class="dropdown-divider"></div>
                <button class="dropdown-item">Delete section</button>
              </div>
            </div>
          </div>
        </div>
        
        <div class="section-children" *ngIf="expandedSections.has(section.id)">
          <div 
            *ngFor="let page of section.children" 
            class="tree-page"
            [class.active]="activePageId === page.id"
            (click)="onPageClick(page.id)">
            {{ page.title }}
          </div>
        </div>
      </div>
    </ng-container>
  </div>
</aside>
